name: PISO Chain CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-smart-contracts:
    name: Hardhat Smart Contract Compilation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Compile Solidity Smart Contracts
        run: npm run compile

      - name: Run Hardhat Unit Test Suite
        run: npm run test

  test-python-tooling:
    name: Python Cluster Provisioner & Relayer Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-node@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Multi-Validator Cluster Generator Script Syntax
        run: python -m py_compile scripts/setup_multi_validator_cluster.py

      - name: Verify Bridge Relayer Script Syntax
        run: python -m py_compile bridge/relayer.py
