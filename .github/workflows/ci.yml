name: PISO Chain Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-smart-contracts:
    name: Hardhat Smart Contract Compilation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Compile Solidity Smart Contracts
        run: npm run compile

      - name: Run Hardhat Unit Test Suite
        run: npm run test

      - name: Build TypeScript Developer SDK
        run: npm --prefix sdk run build

  test-wallet-infrastructure:
    name: Wallet Infrastructure & Cryptography Unit & Benchmark Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install eth-keys eth-utils pycryptodome web3 hexbytes

      - name: Run Full Wallet Unit Test Suite
        run: python -m unittest discover -s tests -p "test_*.py"
