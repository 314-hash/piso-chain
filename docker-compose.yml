version: '3.8'

services:
  # 1. PISO Chain Validator Node (BSC Parlia PoSA Engine)
  validator1:
    image: ghcr.io/bnb-chain/bsc:latest
    container_name: piso-validator-1
    user: root
    restart: unless-stopped
    volumes:
      - ./genesis/genesis_parlia.json:/bsc/config/genesis.json:ro
      - ./genesis/config.toml:/bsc/config/config.toml:ro
      - ./genesis/password.txt:/bsc/config/password.txt:ro
      - ./docker/data/validator_mainnet:/root/.ethereum
      - ./docker/keystore:/root/.ethereum/keystore
    ports:
      - "8545:8545"   # HTTP RPC
      - "8546:8546"   # WebSocket RPC
      - "30303:30303" # P2P
    command:
      - --datadir=/root/.ethereum
      - --config=/bsc/config/config.toml
      - --networkid=2026001
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.corsdomain=*
      - --http.api=eth,net,web3,parlia,miner,txpool
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --ws.api=eth,net,web3,parlia
      - --mine
      - --miner.etherbase=0xE3aFaeC0677A6C34CC190B1f8f68f1d712D45614
      - --unlock=0xE3aFaeC0677A6C34CC190B1f8f68f1d712D45614
      - --password=/bsc/config/password.txt
      - --miner.gaslimit=30000000
      - --allow-insecure-unlock

  # 2. Blockscout PostgreSQL Database
  blockscout-db:
    image: postgres:15-alpine
    container_name: piso-blockscout-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: piso_password_123
    volumes:
      - ./explorer/data/db:/var/lib/postgresql/data

  # 3. Blockscout Redis
  blockscout-redis:
    image: redis:7-alpine
    container_name: piso-blockscout-redis
    restart: unless-stopped

  # 4. Blockscout Full Explorer
  explorer:
    image: blockscout/blockscout:latest
    container_name: piso-explorer
    restart: unless-stopped
    ports:
      - "8080:4000"
    environment:
      - ETHEREUM_JSONRPC_VARIANT=geth
      - ETHEREUM_JSONRPC_HTTP_URL=http://validator1:8545
      - ETHEREUM_JSONRPC_WS_URL=ws://validator1:8546
      - DATABASE_URL=postgresql://postgres:piso_password_123@blockscout-db:5432/blockscout
      - REDIS_URL=redis://blockscout-redis:6379/0
      - NETWORK=PISO Chain Mainnet
      - SUBNETWORK=PISO
      - CHAIN_ID=2026001
      - COIN=PISO
    depends_on:
      - validator1
      - blockscout-db
      - blockscout-redis

  # 5. Caddy Security Gateway / TLS Reverse Proxy
  caddy-gateway:
    image: caddy:latest
    container_name: piso-caddy-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - validator1
      - explorer

  # 6. Freqtrade Algorithmic Trading Bot (Dry-Run by default)
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: piso-freqtrade
    restart: unless-stopped
    ports:
      - "8180:8180"   # Freqtrade REST API
    volumes:
      - ./config/freqtrade:/freqtrade/user_data/config_custom:ro
      - ./freqtrade/user_data:/freqtrade/user_data
    command: >
      trade
      --config /freqtrade/user_data/config_custom/piso_config.json
      --strategy-path /freqtrade/user_data/config_custom
      --strategy PISOStrategy
      --logfile /freqtrade/user_data/logs/freqtrade.log
    environment:
      - FREQTRADE__EXCHANGE__KEY=${EXCHANGE_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${EXCHANGE_SECRET:-}
    depends_on:
      - validator1

  # 7. PISO ↔ Freqtrade Bridge (submits trade proofs to PISOFreqtradeOracle.sol)
  freqtrade-bridge:
    image: python:3.11-slim
    container_name: piso-freqtrade-bridge
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: python bridge/freqtrade_bridge.py
    environment:
      - RPC_URL=http://validator1:8545
      - FREQTRADE_API_URL=http://freqtrade:8180
      - FREQTRADE_API_USER=${FREQTRADE_API_USER:-pisobot}
      - FREQTRADE_API_PASSWORD=${FREQTRADE_API_PASSWORD:-changeme}
      - WORKER_PRIVATE_KEY=${WORKER_PRIVATE_KEY:-}
      - FREQTRADE_ORACLE_ADDRESS=${FREQTRADE_ORACLE_ADDRESS:-}
    depends_on:
      - validator1
      - freqtrade
