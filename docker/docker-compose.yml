version: '3.8'

services:
  # PISO Chain Validator Node 1 (Clique PoA Signer)
  validator1:
    image: ethereum/client-go:v1.13.14
    container_name: piso-validator-1
    restart: unless-stopped
    volumes:
      - ../genesis.json:/genesis.json:ro
      - ./data/validator1:/root/.ethereum
      - ./keystore:/root/.ethereum/keystore
    ports:
      - "8545:8545"   # HTTP RPC
      - "8546:8546"   # WebSocket RPC
      - "30303:30303" # P2P
    command:
      - --datadir=/root/.ethereum
      - --networkid=2026001
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.corsdomain=*
      - --http.api=eth,net,web3,personal,clique,miner,txpool
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --ws.api=eth,net,web3,clique
      - --mine
      - --miner.gaslimit=30000000
      - --allow-insecure-unlock

  # Blockscout PostgreSQL Database
  blockscout-db:
    image: postgres:15-alpine
    container_name: piso-blockscout-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: piso_password_123
    ports:
      - "5433:5432"

  # Blockscout Full-Featured L1 Block Explorer
  explorer:
    image: blockscout/blockscout:latest
    container_name: piso-explorer
    restart: unless-stopped
    ports:
      - "8080:4000"
    environment:
      - ETHEREUM_JSONRPC_VARIANT=geth
      - ETHEREUM_JSONRPC_HTTP_URL=http://validator1:8545
      - ETHEREUM_JSONRPC_WS_URL=ws://validator1:8546
      - DATABASE_URL=postgresql://postgres:piso_password_123@blockscout-db:5432/blockscout
      - NETWORK=PISO Chain Devnet
      - SUBNETWORK=PISO
      - CHAIN_ID=2026001
      - COIN=PISO
    depends_on:
      - validator1
      - blockscout-db


  # Nginx Reverse Proxy for Public Subdomains (RPC, WS, Explorer)
  nginx-proxy:
    image: nginx:alpine
    container_name: piso-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../rpc/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - validator1
      - explorer
