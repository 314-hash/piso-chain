apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: piso-validator-kms
  namespace: piso-chain
  labels:
    app: piso-validator-kms
spec:
  serviceName: piso-validator-kms-p2p
  replicas: 3
  selector:
    matchLabels:
      app: piso-validator-kms
  template:
    metadata:
      labels:
        app: piso-validator-kms
    spec:
      containers:
        # Main BSC Consensus Validator Node
        - name: bsc-validator
          image: ghcr.io/bnb-chain/bsc:latest
          ports:
            - containerPort: 8545
              name: rpc-http
            - containerPort: 8546
              name: rpc-ws
            - containerPort: 30303
              name: p2p
          command:
            - geth
            - --datadir=/root/.ethereum
            - --config=/bsc/config/config.toml
            - --networkid=2026001
            - --mine
            - --signer=/clef/clef.ipc
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "8"
          volumeMounts:
            - name: genesis-vol
              mountPath: /bsc/config
              readOnly: true
            - name: validator-data
              mountPath: /root/.ethereum
            - name: clef-socket
              mountPath: /clef

        # Isolated Clef / KMS Hardware Signer Sidecar Container
        - name: clef-kms-signer
          image: ethereum/client-go:alltools-latest
          command:
            - clef
            - --keystore=/clef/keystore
            - --configdir=/clef/config
            - --chainid=2026001
            - --suppress-waring
            - --stdio-ui
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: clef-socket
              mountPath: /clef
            - name: kms-secret-vol
              mountPath: /clef/keystore
              readOnly: true

      volumes:
        - name: genesis-vol
          configMap:
            name: piso-genesis-config
        - name: clef-socket
          emptyDir: {}
        - name: kms-secret-vol
          secret:
            secretName: piso-validator-kms-keys
  volumeClaimTemplates:
    - metadata:
        name: validator-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 200Gi
