apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: piso-validator
  namespace: piso-chain
  labels:
    app: piso-validator
spec:
  serviceName: piso-validator-p2p
  replicas: 3
  selector:
    matchLabels:
      app: piso-validator
  template:
    metadata:
      labels:
        app: piso-validator
    spec:
      containers:
        - name: bsc-validator
          image: ghcr.io/bnb-chain/bsc:latest
          ports:
            - containerPort: 8545
              name: rpc-http
            - containerPort: 8546
              name: rpc-ws
            - containerPort: 30303
              name: p2p
          command:
            - geth
            - --datadir=/root/.ethereum
            - --config=/bsc/config/config.toml
            - --networkid=2026001
            - --mine
            - --allow-insecure-unlock
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "8"
          volumeMounts:
            - name: genesis-vol
              mountPath: /bsc/config
              readOnly: true
            - name: validator-data
              mountPath: /root/.ethereum
      volumes:
        - name: genesis-vol
          configMap:
            name: piso-genesis-config
  volumeClaimTemplates:
    - metadata:
        name: validator-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 200Gi
