# Nginx Reverse Proxy Configuration for PISO Chain Subdomains
# Exposes HTTP RPC, WebSocket RPC, and Block Explorer with SSL support

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access_log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting for RPC endpoints to prevent DDoS / abuse
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=30r/s;

    # -------------------------------------------------------------
    # 1. HTTP RPC Subdomain (rpc.yourdomain.com -> 8545)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name rpc.yourdomain.com;

        # Redirect HTTP to HTTPS (uncomment when SSL certificate is generated)
        # return 301 https://$host$request_uri;

        location / {
            limit_req zone=rpc_limit burst=50 nodelay;

            proxy_pass http://validator1:8545;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS Headers for Web3 Frontends / dApps
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }

    # -------------------------------------------------------------
    # 2. WebSocket RPC Subdomain (ws.yourdomain.com -> 8546)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name ws.yourdomain.com;

        location / {
            proxy_pass http://validator1:8546;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for WebSocket long-lived connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # -------------------------------------------------------------
    # 3. Block Explorer Subdomain (explorer.yourdomain.com -> 8080)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name explorer.yourdomain.com;

        location / {
            proxy_pass http://explorer:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
